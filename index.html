<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const ADMIN_PIN="1234";
const NOMI={"plateatico":"Plateatico","interna":"Sala Interna","cucina":"Sala Cucina","prive":"Sala Prive"};
const SITTING=120;
const MAX_PPL=20;
const SALE_IDS=["plateatico","interna","cucina","prive"];
const LABELS={"B1":"104","B2":"105","B3":"106"};
const TABLES_BY_SALA={"plateatico":["209","205","207","201","210","204","208"],"interna":["11","12","13","14","15","16","17","18","1","2","3","4","B1","B2","B3"],"cucina":["21","22","23","24","25","31","32"],"prive":["47","49","50","54","51","52"]};

const ALL_SLOTS=(()=>{
  const s=[];
  for(let h=17;h<=22;h++){
    for(let m=0;m<60;m+=15){
      if(h===22&&m>0)break;
      if(h===17&&m<30)continue;
      s.push((h<10?"0"+h:h)+":"+(m===0?"00":m<10?"0"+m:m));
    }
  }
  return s;
})();

function toM(t){const[h,m]=t.split(":").map(Number);return h*60+m;}

function bkKey(sala,num,off,time){return sala+"|"+num+"|"+off+"|"+time;}

function getTableBks(bks,sala,num,off){
  return Object.keys(bks)
    .filter(k=>k.startsWith(sala+"|"+num+"|"+off+"|"))
    .map(k=>{const t=k.split("|")[3];return{time:t,...bks[k]};})
    .sort((a,b)=>toM(a.time)-toM(b.time));
}

function isOccupiedAt(bks,sala,num,off,viewTime){
  const vm=toM(viewTime);
  return getTableBks(bks,sala,num,off).some(bk=>{const bm=toM(bk.time);return vm>=bm&&vm<bm+SITTING;});
}

function getActiveBk(bks,sala,num,off,viewTime){
  const vm=toM(viewTime);
  return getTableBks(bks,sala,num,off).find(bk=>{const bm=toM(bk.time);return vm>=bm&&vm<bm+SITTING;});
}

function getBookingStartTime(bks,sala,num,off,viewTime){
  const vm=toM(viewTime);
  const bk=getTableBks(bks,sala,num,off).find(b=>{const bm=toM(b.time);return vm>=bm&&vm<bm+SITTING;});
  return bk?bk.time:null;
}

function checkBooking(bks,sala,num,off,newTime){
  const nm=toM(newTime);
  const existing=getTableBks(bks,sala,num,off);
  if(existing.some(bk=>{const bm=toM(bk.time);return nm>=bm&&nm<bm+SITTING;})){return{ok:false,warning:null};}
  let warning=null;
  for(const bk of existing){
    const bm=toM(bk.time);
    if(bm>nm&&bm<nm+SITTING){
      const avail=bm-nm;
      const h=Math.floor(avail/60);const m=avail%60;
      warning="Attenzione: avrai solo "+(h>0?h+"h ":"")+(m>0?m+" min ":"")+"a questo tavolo (prossima prenotazione alle "+bk.time+").";
    }
  }
  return{ok:true,warning};
}

function countPplInSlot(bks,off,viewTime){
  const vm=toM(viewTime);
  let tot=0;
  Object.keys(bks).forEach(k=>{
    const p=k.split("|");
    if(p.length===4&&p[2]===String(off)){
      const bm=toM(p[3]);
      if(vm>=bm&&vm<bm+SITTING)tot+=(parseInt(bks[k].persone)||0);
    }
  });
  return tot;
}

function isTodayClosed(off){
  if(off!==0)return false;
  const n=new Date();return n.getHours()>=20;
}


function FP_Plateatico(props){
  return(
    <svg viewBox="0 0 380 340" width="100%" height="100%" style={{display:"block"}}>
      <rect width="380" height="340" fill="#180E08" rx="12"/>
      <rect x="1" y="1" width="378" height="338" rx="11" fill="none" stroke="rgba(160,50,30,.18)" strokeWidth="1.5"/>
{(()=>{
  const occupied=props.isOcc("plateatico","209");
  const bk=props.getBk("plateatico","209");
  const isA=props.isA;
  const TF=occupied?"#8B1A1A":"#221510";
  const TS=occupied?"#A03020":"rgba(240,232,220,.12)";
  const NF=occupied?"#F0E8DC":"rgba(240,232,220,.6)";
  const CF=occupied?"rgba(139,26,26,.35)":"rgba(240,232,220,.1)";
  const CS=occupied?"rgba(160,50,30,.4)":"rgba(240,232,220,.18)";
  const BF="rgba(100,30,15,.45)";const BS="rgba(160,50,30,.5)";
  return(
    <g style={{cursor:"pointer"}} onClick={()=>props.onOpen("209",occupied,bk,{num:"209",pax:4,sg:false,label:"209"})} >

  const [modal,setModal]=useState(null);
  const [bks,setBks]=useState({});
  const [form,setForm]=useState({nome:"",tel:"",persone:"",note:""});
  const [paxErr,setPaxErr]=useState(false);
  const [isAdmin,setIsAdmin]=useState(false);
  const [showPin,setShowPin]=useState(false);
  const [pin,setPin]=useState("");
  const [pinErr,setPinErr]=useState("");
  const [showCal,setShowCal]=useState(false);
  const [calMonth,setCalMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [showReport,setShowReport]=useState(false);
  const pinRef=useRef();
  const slotRef=useRef();

  const today=new Date().toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});

  function dlbl(o){
    const d=new Date();d.setDate(d.getDate()+o);
    const s=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
    return o===0?"Oggi  "+s:o===1?"Domani  "+s:s;
  }

  useEffect(()=>{
    if(slotRef.current){
      const el=slotRef.current.querySelector(".slotbtn.on");
      if(el)el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
    }
  },[slot]);

  const openTable=(num,occupied,bk,tbl)=>{
    const check=occupied?null:checkBooking(bks,sala,num,off,slot);
    setModal({num,occupied,bk,salaId:sala,tbl,check});
    setForm({nome:"",tel:"",persone:"",note:""});
    setPaxErr(false);
  };

  const chPers=(v)=>{
    setForm(p=>({...p,persone:v}));
    setPaxErr(modal&&v&&parseInt(v)>modal.tbl.pax);
  };

  const book=()=>{
    if(!form.nome.trim()||paxErr||!form.persone)return;
    const totalNow=countPplInSlot(bks,off,slot);
    if(totalNow+(parseInt(form.persone)||0)>MAX_PPL){alert("Limite di "+MAX_PPL+" persone per questo orario raggiunto.");return;}
    setBks(p=>({...p,[bkKey(sala,modal.num,off,slot)]:{nome:form.nome,tel:form.tel,persone:form.persone,note:form.note}}));
    setModal(null);
  };

  const libera=()=>{
    const startTime=getBookingStartTime(bks,modal.salaId,modal.num,off,slot);
    if(startTime){setBks(p=>{const n={...p};delete n[bkKey(modal.salaId,modal.num,off,startTime)];return n;});}
    setModal(null);
  };

  const tryPin=()=>{if(pin===ADMIN_PIN){setIsAdmin(true);setShowPin(false);setPin("");setPinErr("");}else{setPinErr("PIN errato");setPin("");}};
  const toggleAdmin=()=>{if(isAdmin)setIsAdmin(false);else{setShowPin(true);setTimeout(()=>{if(pinRef.current)pinRef.current.focus();},100);}};

  const curPpl=countPplInSlot(bks,off,slot);
  const slotFull=curPpl>=MAX_PPL;

  return(
    <div className="app">
      <div className="hd">
        <div className="hd-row">
          <div><div className="logo-d">D</div><div className="logo-s">Donatelli</div></div>
          <div className="hd-right">
            <div className="hdate">{today}</div>
            <div style={{display:"flex",gap:6}}>
              {isAdmin&&<button className="adminbtn on" style={{background:"rgba(160,50,30,.3)",borderColor:"rgba(160,50,30,.5)"}} onClick={()=>setShowReport(true)}>Riepilogo</button>}
              <button className={"adminbtn"+(isAdmin?" on":"")} onClick={toggleAdmin}>{isAdmin?"Admin ON":"Admin"}</button>
            </div>
          </div>
        </div>
      </div>

      <div className="dn">
        <button className="arw" onClick={()=>setOff(o=>o-1)}>&#8249;</button>
        <button className="dlbl" onClick={()=>setShowCal(true)}>{dlbl(off)}</button>
        <button className="tbtn" onClick={()=>setOff(0)}>Oggi</button>
        <button className="arw" onClick={()=>setOff(o=>o+1)}>&#8250;</button>
      </div>

      <div className="slots-wrap">
        <div className="slots-scroll" ref={slotRef}>
          {ALL_SLOTS.map(s=>{
            const ppl=countPplInSlot(bks,off,s);
            const full=ppl>=MAX_PPL;
            return(
              <button key={s} className={"slotbtn"+(slot===s?" on":"")+(full?" full":"")} onClick={()=>setSlot(s)}>
                {s}{ppl>0&&<span style={{fontSize:9,marginLeft:4,opacity:.7}}>{ppl}p</span>}
              </button>
            );
          })}
        </div>
        <div className="slot-info">
          <span className={"slot-pax"+(curPpl>=15?" warn":"")+(slotFull?" full":"")}>
            {curPpl}/{MAX_PPL} persone prenotate alle {slot}
          </span>
          {slotFull&&<span style={{fontSize:10,color:"#C44040",fontWeight:700}}>SLOT PIENO</span>}
        </div>
      </div>

      <div className="rt">
        {SALE_IDS.map(id=><button key={id} className={"rbt"+(sala===id?" on":"")} onClick={()=>setSala(id)}>{NOMI[id]}</button>)}
      </div>

      <div className="lg">
        <div className="li"><div className="ld" style={{background:"#221510",border:"1px solid rgba(240,232,220,.15)"}}/>Libero</div>
        <div className="li"><div className="ld" style={{background:"#8B1A1A"}}/>Prenotato</div>
        {isAdmin&&<div className="li" style={{marginLeft:"auto",fontSize:9,color:"rgba(240,232,220,.4)",fontStyle:"italic"}}>admin</div>}
      </div>

      <div className="fw">
        <FloorComp sala={sala} bks={bks} off={off} slot={slot} isA={isAdmin} onOpen={openTable}/>
      </div>

      {modal&&(
        <div className="ov" onClick={()=>setModal(null)}>
          <div className="sh" onClick={e=>e.stopPropagation()}>
            <div className="sh-ey">{NOMI[modal.salaId]}</div>
            <div className="sh-ti">Tavolo {modal.tbl.label||modal.num}</div>
            <div className="sh-ba">{slot}</div>
            <span className="sh-px">Capacita massima: {modal.tbl.pax} persone</span>
            <div className="contact-note"><span style={{fontSize:16}}>Tel</span><p>Per informazioni o cambi orario contattare il <a href="tel:+390453011">045 30 11</a></p></div>
            {modal.tbl.sg&&<div className="sg-note">Questo tavolo e attrezzato con sgabelli alti. Potrebbe non essere la scelta piu comoda per bambini piccoli o chi preferisce sedie tradizionali.</div>}

            {modal.occupied?(
              isAdmin&&modal.bk?(
                <div>
                  <div className="bi">
                    <div className="bir"><span className="bik">Cliente</span><span className="biv">{modal.bk.nome}</span></div>
                    <div className="bir"><span className="bik">Prenotato alle</span><span className="biv">{getBookingStartTime(bks,modal.salaId,modal.num,off,slot)||slot}</span></div>
                    <div className="bir"><span className="bik">Telefono</span><span className="biv">{modal.bk.tel||"--"}</span></div>
                    <div className="bir"><span className="bik">Persone</span><span className="biv">{modal.bk.persone||"--"}</span></div>
                    <div className="bir"><span className="bik">Note</span><span className="biv">{modal.bk.note||"--"}</span></div>
                  </div>
                  <button className="bfr" onClick={libera}>Libera tavolo</button>
                  <button className="bca" onClick={()=>setModal(null)}>Chiudi</button>
                </div>
              ):(
                <div>
                  <div className="pm"><p style={{fontFamily:"Cormorant Garamond,serif",fontSize:17,color:"rgba(240,232,220,.4)",fontStyle:"italic"}}>Questo tavolo e gia riservato.</p></div>
                  <button className="bca" onClick={()=>setModal(null)}>Chiudi</button>
                </div>
              )
            ):(
              isTodayClosed(off)?(
                <div>
                  <div style={{background:"rgba(139,26,26,.1)",border:"1px solid rgba(139,26,26,.25)",borderRadius:12,padding:20,textAlign:"center",marginBottom:16}}>
                    <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:18,color:"#F0E8DC",marginBottom:8}}>Prenotazioni chiuse</p>
                    <p style={{fontSize:13,color:"rgba(240,232,220,.45)",lineHeight:1.6,marginBottom:14}}>Le prenotazioni online per oggi chiudono alle 20:00.</p>
                    <a href="tel:+390453011" style={{fontSize:18,fontWeight:700,color:"rgba(212,175,100,.8)",fontFamily:"Cormorant Garamond,serif"}}>045 30 11</a>
                  </div>
                  <button className="bca" onClick={()=>setModal(null)}>Chiudi</button>
                </div>
              ):slotFull?(
                <div>
                  <div style={{background:"rgba(196,64,64,.1)",border:"1px solid rgba(196,64,64,.25)",borderRadius:12,padding:16,textAlign:"center",marginBottom:16}}>
                    <p style={{fontSize:14,color:"#C44040",fontWeight:600,marginBottom:6}}>Slot pieno</p>
                    <p style={{fontSize:12,color:"rgba(240,232,220,.4)",lineHeight:1.5}}>Alle {slot} e gia stato raggiunto il limite di {MAX_PPL} persone. Scegli un altro orario.</p>
                  </div>
                  <button className="bca" onClick={()=>setModal(null)}>Chiudi</button>
                </div>
              ):(
                <div>
                  {modal.check&&modal.check.warning&&<div className="warn-dur">! {modal.check.warning}</div>}
                  <label className="fl">Nome cliente</label>
                  <input className="fi" placeholder="Es. Rossi Mario" autoFocus value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&book()}/>
                  <label className="fl">Numero di telefono</label>
                  <input className="fi" placeholder="Es. 347 1234567" type="tel" value={form.tel} onChange={e=>setForm(p=>({...p,tel:e.target.value}))}/>
                  <div className="frow">
                    <div>
                      <label className="fl">Persone</label>
                      <input className={"fi"+(paxErr?" er":"")} type="number" placeholder="2" min="1" max={modal.tbl.pax} value={form.persone} onChange={e=>chPers(e.target.value)}/>
                      {paxErr&&<div className="err">Max {modal.tbl.pax} persone</div>}
                    </div>
                    <div>
                      <label className="fl">Note</label>
                      <input className="fi" placeholder="Allergie..." value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}/>
                    </div>
                  </div>
                  <button className="bbk" onClick={book} disabled={!form.nome.trim()||paxErr||!form.persone}>Prenota alle {slot}</button>
                  <button className="bca" onClick={()=>setModal(null)}>Annulla</button>
                </div>
              )
            )}
          </div>
        </div>
      )}

      {showCal&&(
        <div className="cal-ov" onClick={()=>setShowCal(false)}>
          <div className="cal-sh" onClick={e=>e.stopPropagation()}>
            <div className="cal-hd">
              <button className="cal-nb" onClick={()=>setCalMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})}>&#8249;</button>
              <span className="cal-mn">{new Date(calMonth.y,calMonth.m,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</span>
              <button className="cal-nb" onClick={()=>setCalMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})}>&#8250;</button>
            </div>
            <div className="cal-days">
              {["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(d=><div key={d} className="cal-dn">{d}</div>)}
              {(()=>{
                const td=new Date();td.setHours(0,0,0,0);
                const first=new Date(calMonth.y,calMonth.m,1);
                const startDow=(first.getDay()+6)%7;
                const days=new Date(calMonth.y,calMonth.m+1,0).getDate();
                const cells=[];
                for(let i=0;i<startDow;i++)cells.push(<div key={"e"+i} className="cal-day empty"/>);
                for(let d=1;d<=days;d++){
                  const dt=new Date(calMonth.y,calMonth.m,d);
                  const diff=Math.round((dt-td)/(1000*60*60*24));
                  cells.push(<div key={d} className={"cal-day"+(dt.getTime()===td.getTime()?" today":"")+(diff===off?" sel":"")} onClick={()=>{setOff(diff);setShowCal(false);}}>{d}</div>);
                }
                return cells;
              })()}
            </div>
            <button className="cal-close" onClick={()=>setShowCal(false)}>Chiudi</button>
          </div>
        </div>
      )}

      {showReport&&isAdmin&&(()=>{
        const td=new Date();td.setHours(0,0,0,0);
        const tgt=new Date(td);tgt.setDate(td.getDate()+off);
        const ds=tgt.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
        const bySlot={};
        Object.keys(bks).forEach(k=>{
          const[sid,num,dayOff,time]=k.split("|");
          if(parseInt(dayOff)===off){
            if(!bySlot[time])bySlot[time]={};
            if(!bySlot[time][sid])bySlot[time][sid]=[];
            bySlot[time][sid].push({num,label:LABELS[num]||num,...bks[k]});
          }
        });
        const usedSlots=ALL_SLOTS.filter(s=>bySlot[s]&&Object.keys(bySlot[s]).length>0);
        return(
          <div className="rep-ov">
            <div className="rep-hd">
              <div><div className="rep-title">Riepilogo</div><div className="rep-sub">{ds}</div></div>
              <div className="rep-actions">
                <button className="rep-print" onClick={()=>window.print()}>Stampa PDF</button>
                <button className="rep-close" onClick={()=>setShowReport(false)}>x</button>
              </div>
            </div>
            <div className="rep-body">
              {usedSlots.length===0&&<div className="rep-empty" style={{marginTop:40}}>Nessuna prenotazione.</div>}
              {usedSlots.map(s=>{
                const ppl=countPplInSlot(bks,off,s);
                return(
                  <div key={s} className="rep-slot">
                    <div className="rep-slot-hd">
                      <div className="rep-slot-time">{s}</div>
                      <div className="rep-slot-count">{ppl} ospiti</div>
                    </div>
                    {bySlot[s]&&SALE_IDS.filter(sid=>bySlot[s][sid]).map(sid=>(
                      <div key={sid}>
                        <div className="rep-sala-hd">{NOMI[sid]}</div>
                        {bySlot[s][sid].map((bk,i)=>(
                          <div key={i} className="rep-row">
                            <div className="rep-tnum">{bk.label}</div>
                            <div className="rep-info">
                              <div className="rep-nome">{bk.nome}</div>
                              <div className="rep-detail">{bk.tel}{bk.note&&bk.note!==""?"  -  "+bk.note:""}</div>
                            </div>
                            <div className="rep-pax">{bk.persone}px</div>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {showPin&&(
        <div className="pin-ov" onClick={()=>{setShowPin(false);setPin("");setPinErr("");}}>
          <div className="pin-sh" onClick={e=>e.stopPropagation()}>
            <div className="pin-ti">Accesso Admin</div>
            <div className="pin-su">Inserisci il PIN per visualizzare i dettagli delle prenotazioni</div>
            <input ref={pinRef} className="pin-in" type="password" maxLength="4" placeholder="****" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryPin()}/>
            <div className="pin-er">{pinErr}</div>
            <button className="pin-bt" onClick={tryPin}>Conferma</button>
            <button className="pin-ca" onClick={()=>{setShowPin(false);setPin("");setPinErr("");}}>Annulla</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
