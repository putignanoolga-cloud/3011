function loadBks(){
  sb.from("prenotazioni").select("*").then(function(res){
    if(res.error){console.error(res.error);return;}
    bks={};
    res.data.forEach(function(row){
      var o=dateToOff(row.giorno);

}

  var dateStr=offToDate(o);

  sb.from("prenotazioni").upsert({id:id,sala:salaId,giorno:dateStr,slot:slotId,tavolo:tavolo,nome:entry.nome,tel:entry.tel,persone:entry.persone,nota:entry.note}).then(function(res){

}

function bkey(s,o,t,n){return s+"|"+o+"|"+t+"|"+n;}
function getPpl(o,s){var t=0;var ks=Object.keys(bks);for(var i=0;i<ks.length;i++){var p=ks[i].split("|");if((+p[1])===o&&p[2]===s)t+=(+(bks[ks[i]].persone||0));}return t;}
function isBlk(s,o,sl,n){var sm=t2m(sl);var ks=Object.keys(bks);for(var i=0;i<ks.length;i++){var p=ks[i].split("|");if(p[0]!==s||(+p[1])!==o||p[3]!==n)continue;if(Math.abs(sm-t2m(p[2]))<DUR)return true;}return false;}
function nextBk(s,o,sl,n){var sm=t2m(sl),nx=99999;var ks=Object.keys(bks);for(var i=0;i<ks.length;i++){var p=ks[i].split("|");if(p[0]!==s||(+p[1])!==o||p[3]!==n)continue;var bm=t2m(p[2]);if(bm>sm&&bm<nx)nx=bm;}return nx===99999?null:nx;}
function isClosed(){if(off!==0)return false;return (new Date()).getHours()>=20;}
function dlbl(){var d=new Date();d.setDate(d.getDate()+off);var s=d.toLocaleDateString("it-IT",{"weekday":"long","day":"numeric","month":"long"});if(off===0)return "Oggi  "+s;if(off===1)return "Domani  "+s;return s;}
function render(){
  document.getElementById("dlbl").textContent=dlbl();
  document.getElementById("dlbl").style.cssText="flex:1;text-align:center;font-size:12px;color:rgba(240,232,220,.7);font-weight:500;background:transparent;border:none;cursor:pointer";
  document.getElementById("hdate").textContent=(new Date()).toLocaleDateString("it-IT",{"weekday":"short","day":"numeric","month":"short"});
  document.getElementById("arwL").style.opacity=(!isAdmin&&off<=0)?"0.2":"1";
  document.getElementById("abtn").className="abtn"+(isAdmin?" on":"");
  document.getElementById("abtn").textContent=isAdmin?"Admin ON":"Admin";
  document.getElementById("adminlbl").style.display=isAdmin?"flex":"none";
  document.getElementById("repbtn").style.display=isAdmin?"flex":"none";
  var sm=t2m(slot),endT=m2t(sm+DUR);
  var sr="";
  for(var i=0;i<SLOTS.length;i++){var s=SLOTS[i];var ppl=getPpl(off,s);var full=(ppl>=MAXP);sr+='<button class="sb'+(s===slot?" on":"")+(full&&s!==slot?" full":"")+'" onclick="setSlot(\''+s+'\')">'+(full&&s!==slot?s+" P":s)+'</button>';}
  document.getElementById("sr").innerHTML=sr;
  document.getElementById("sc").textContent=getPpl(off,slot)+"/"+MAXP+" persone - libero fino alle "+endT;
  var rt="";var sids=["plateatico","interna","cucina","prive"];
  for(var i=0;i<sids.length;i++){var id=sids[i];rt+='<button class="rbt'+(sala===id?" on":"")+'" onclick="setSala(\''+id+'\')">'+(NOMI[id])+'</button>';}
  document.getElementById("rt").innerHTML=rt;
  document.getElementById("sd").textContent=DESC[sala];
  renderFloor();
}
function makeDiv(num,x,y,w,h,booked,entry){
  var el=document.createElement("div");
  el.className="tbl"+(booked?" booked":"");
  el.style.left=x+"%";el.style.top=y+"%";el.style.width=w+"%";el.style.height=h+"%";
  if(ROUND[num])el.style.borderRadius="50%";
  var inner=document.createElement("div");inner.className="tbl-inner";
  var tn=document.createElement("span");tn.className="tn";tn.textContent=LBL[num]||num;inner.appendChild(tn);
  if(booked){var tg=document.createElement("span");tg.className="tg";if(isAdmin&&entry){tg.textContent=entry.nome.split(" ")[0];tg.style.color="rgba(240,232,220,.8)";tg.style.fontWeight="600";}else{tg.textContent="riservato";tg.style.color="rgba(240,232,220,.3)";tg.style.fontStyle="italic";}inner.appendChild(tg);}
  el.appendChild(inner);
  var n2=num,b2=booked,e2=entry;
  el.onclick=function(){openModal(n2,b2,e2);};
  return el;
}
function renderFloor(){
  var fp=document.getElementById("fp");fp.innerHTML="";
  if(sala==="interna"){renderInterna(fp);return;}
  var pos=TPOS[sala];if(!pos)return;
  for(var i=0;i<pos.length;i++){var t=pos[i];var k=bkey(sala,off,slot,t.n);fp.appendChild(makeDiv(t.n,t.x,t.y,t.w,t.h,!!bks[k],bks[k]));}
}
function renderInterna(fp){
  var wall1=document.createElement("div");wall1.style.cssText="position:absolute;left:2.6%;top:1.9%;right:2.6%;height:1.2%;background:rgba(160,50,30,.25);border-radius:2px";fp.appendChild(wall1);
  var wT={"2":36,"4":50,"6":64};var tops=["11","12","13","14","15","16","17","18"];var x=14;
  for(var i=0;i<tops.length;i++){var num=tops[i];var pw=wT[PAX[num]];var pctX=(x/380)*100;var pctW=(pw/380)*100;var k=bkey("interna",off,slot,num);fp.appendChild(makeDiv(num,pctX,78/430*100,pctW,30/430*100,!!bks[k],bks[k]));x+=pw+5;}
  var wM={"2":42,"4":56};var mids=["1","2","3","4"];var tot=0;
  for(var i=0;i<mids.length;i++)tot+=wM[PAX[mids[i]]];tot+=3*14;
  var sx=(380-tot)/2;
  for(var i=0;i<mids.length;i++){var num=mids[i];var pw=wM[PAX[num]];var k=bkey("interna",off,slot,num);fp.appendChild(makeDiv(num,sx/380*100,215/430*100,pw/380*100,36/430*100,!!bks[k],bks[k]));sx+=pw+14;}
  var bx=22;var banco=["B1","B2","B3"];
  for(var i=0;i<banco.length;i++){var num=banco[i];var k=bkey("interna",off,slot,num);fp.appendChild(makeDiv(num,bx/380*100,370/430*100,104/380*100,30/430*100,!!bks[k],bks[k]));bx+=110;}
  var wall2=document.createElement("div");wall2.style.cssText="position:absolute;left:2.6%;bottom:1.2%;right:2.6%;height:1.2%;background:rgba(160,50,30,.25);border-radius:2px";fp.appendChild(wall2);
}
function setSlot(s){slot=s;render();}
function setSala(s){sala=s;render();}
function goLeft(){if(isAdmin||off>0){off--;render();}}
function goToday(){off=0;render();}
function openModal(num,booked,entry){modalNum=num;modalSala=sala;modalBooked=booked;modalEntry=entry;forceBook=false;renderModal();document.getElementById("modal").style.display="flex";}
function closeModal(){document.getElementById("modal").style.display="none";}
function renderModal(){
  var sm=t2m(slot),endT=m2t(sm+DUR);var lbl=LBL[modalNum]||modalNum;var pax=PAX[modalNum];
  var nb=nextBk(modalSala,off,slot,modalNum);
  var blocked=isBlk(modalSala,off,slot,modalNum)&&!modalBooked;
  var h='<div class="sey">'+NOMI[modalSala]+'</div>';
  h+='<div class="sti">Tavolo '+lbl+'</div>';
  h+='<div class="sba">'+slot+' - fino alle '+endT+'</div>';
  h+='<span class="spx">Capacita massima: '+pax+' persone</span>';
  h+='<div class="cn">&#128222; Per informazioni contattare il <a href="'+TELHREF+'">'+TEL+'</a></div>';
  if(SG[modalNum])h+='<div class="sgn">Questo tavolo e attrezzato con sgabelli alti. Potrebbe non essere la scelta piu comoda per bambini piccoli o chi preferisce sedie tradizionali.</div>';
  if(nb&&nb<sm+DUR){var a=nb-sm,hh=Math.floor(a/60),mn=a%60,txt=hh>0?(mn>0?hh+"h "+mn+"min":hh+"h"):mn+"min";h+='<div class="wt">Il tavolo e gia prenotato alle '+m2t(nb)+' - avrete a disposizione '+txt+' per cenare.</div>';}
  if(modalBooked){
    if(isAdmin&&modalEntry){h+='<div class="bi"><div class="bir"><span class="bik">Cliente</span><span class="biv">'+modalEntry.nome+'</span></div><div class="bir"><span class="bik">Telefono</span><span class="biv">'+(modalEntry.tel||"--")+'</span></div><div class="bir"><span class="bik">Persone</span><span class="biv">'+(modalEntry.persone||"--")+'</span></div><div class="bir"><span class="bik">Note</span><span class="biv">'+(modalEntry.note||"--")+'</span></div></div><button class="bfr" onclick="doFree()">Libera tavolo</button><button class="bca" onclick="closeModal()">Chiudi</button>';}
    else{h+='<div style="padding:20px;text-align:center;background:rgba(240,232,220,.03);border:1px solid rgba(240,232,220,.07);border-radius:12px;margin-bottom:16px"><p style="font-family:Cormorant Garamond,serif;font-size:17px;color:rgba(240,232,220,.4);font-style:italic">Questo tavolo e gia riservato.</p></div><button class="bca" onclick="closeModal()">Chiudi</button>';}
  }else if(blocked&&!forceBook){
    h+='<div class="bbox"><p style="font-family:Cormorant Garamond,serif;font-size:20px;color:#F0E8DC;margin-bottom:10px">Tavolo gia prenotato nelle vicinanze</p><p style="font-size:13px;color:rgba(240,232,220,.45);line-height:1.6">Questo tavolo ha gia una prenotazione entro 2 ore. Il tempo disponibile potrebbe essere limitato.</p></div><button class="bbk" onclick="doForce()">Prenota comunque</button><button class="bca" onclick="closeModal()">Chiudi</button>';
  }else if(isClosed()){
    h+='<div class="bbox"><p style="font-family:Cormorant Garamond,serif;font-size:20px;color:#F0E8DC;margin-bottom:8px">Prenotazioni chiuse per oggi</p><p style="font-size:13px;color:rgba(240,232,220,.45);line-height:1.6;margin-bottom:12px">Le prenotazioni online chiudono alle 20:00.</p><a href="'+TELHREF+'" style="font-size:18px;font-weight:700;color:rgba(212,175,100,.8);font-family:Cormorant Garamond,serif;text-decoration:none">'+TEL+'</a></div><button class="bca" onclick="closeModal()">Chiudi</button>';
  }else if(getPpl(off,slot)>=MAXP){
    h+='<div class="bbox"><p style="font-family:Cormorant Garamond,serif;font-size:20px;color:#F0E8DC;margin-bottom:8px">Slot esaurito</p><p style="font-size:13px;color:rgba(240,232,220,.45);line-height:1.6">Limite di persone raggiunto. Prova lo slot precedente o successivo.</p></div><button class="bca" onclick="closeModal()">Chiudi</button>';
  }else{
    h+='<label class="fl">Nome cliente</label><input class="fi" id="fnome" placeholder="Es. Rossi Mario" oninput="chkBook()" onkeydown="if(event.key===\'Enter\')doBook()">';
    h+='<label class="fl">Numero di telefono *</label><input class="fi" id="ftel" type="tel" placeholder="Es. 347 1234567" oninput="chkBook()">';
    h+='<div class="frow"><div><label class="fl">Persone</label><input class="fi" id="fpers" type="number" placeholder="2" min="1" max="'+pax+'" oninput="onPers(this.value)"><div id="ferr" style="display:none"></div></div><div><label class="fl">Note</label><input class="fi" id="fnote" placeholder="Allergie..."></div></div>';
    h+='<button class="bbk" id="bbk" onclick="doBook()" disabled>Prenota '+slot+'</button><button class="bca" onclick="closeModal()">Annulla</button>';
  }
  document.getElementById("shcontent").innerHTML=h;
}
function doForce(){forceBook=true;renderModal();}
function doFree(){delete bks[bkey(modalSala,off,slot,modalNum)];deleteBk(modalSala,off,slot,modalNum);closeModal();render();}
function onPers(v){
  var pv=+(v)||0,ppl=getPpl(off,slot),pax=PAX[modalNum],err="";
  if(pv>pax)err="Max "+pax+" persone per questo tavolo";
  else if(ppl+pv>MAXP)err="Slot pieno - prova un altro orario";
  var el=document.getElementById("ferr"),inp=document.getElementById("fpers");
  if(el){
    if(err&&err.indexOf("Slot")>=0){
      var altSlots=[],i;
      for(i=0;i<SLOTS.length;i++){var s=SLOTS[i];if(s===slot)continue;if(getPpl(off,s)+pv>MAXP)continue;if(isBlk(modalSala,off,s,modalNum))continue;altSlots.push(s);}
      var ah='<div class="errbox">'+err+'</div>';
      if(altSlots.length>0){ah+='<div style="margin-top:8px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:rgba(240,232,220,.3);margin-bottom:6px;letter-spacing:.08em">Orari disponibili</div><div style="display:flex;flex-wrap:wrap;gap:6px">';for(i=0;i<altSlots.length;i++){ah+='<button onclick="switchSlot(\''+altSlots[i]+'\')" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(160,50,30,.35);background:rgba(160,50,30,.12);color:rgba(240,232,220,.8);font-size:13px;font-weight:600;cursor:pointer">'+altSlots[i]+'</button>';}ah+='</div></div>';}
      el.innerHTML=ah;el.style.display="block";
    }else if(err){el.innerHTML='<div class="errbox">'+err+'</div>';el.style.display="block";}
    else{el.innerHTML="";el.style.display="none";}
  }
  if(inp)inp.className="fi"+(err?" er":"");
  chkBook();
}
function switchSlot(s){slot=s;renderModal();render();document.getElementById("modal").style.display="flex";}
function chkBook(){
  var n=document.getElementById("fnome"),t=document.getElementById("ftel"),p=document.getElementById("fpers"),b=document.getElementById("bbk"),er=document.getElementById("ferr");
  if(!b)return;
  var hasErr=er&&er.style.display!=="none"&&er.innerHTML!=="";
  b.disabled=!(n&&n.value.trim())||!(t&&t.value.trim())||!(p&&p.value)||hasErr;
}
function doBook(){
  var n=document.getElementById("fnome"),t=document.getElementById("ftel"),p=document.getElementById("fpers"),nt=document.getElementById("fnote");
  if(!n||!n.value.trim()||!t||!t.value.trim()||!p||!p.value)return;
  var entry={nome:n.value,tel:t.value,persone:p.value,note:(nt?nt.value:"")};
  bks[bkey(modalSala,off,slot,modalNum)]=entry;
  saveBk(modalSala,off,slot,modalNum,entry);
  closeModal();render();
}
function togAdmin(){if(isAdmin){isAdmin=false;if(off<0)off=0;}else{document.getElementById("pinov").style.display="flex";setTimeout(function(){var x=document.getElementById("pinput");if(x)x.focus();},100);}render();}
function closePin(){document.getElementById("pinov").style.display="none";document.getElementById("pinput").value="";document.getElementById("pinerr").textContent="";}
function tryPin(){var v=document.getElementById("pinput").value;if(v===PIN){isAdmin=true;closePin();render();}else{document.getElementById("pinerr").textContent="PIN errato";document.getElementById("pinput").value="";}}
function showCal(){calY=(new Date()).getFullYear();calM=(new Date()).getMonth();renderCal();document.getElementById("calov").style.display="flex";}
function closeCal(){document.getElementById("calov").style.display="none";}
function calPrev(){if(calM===0){calM=11;calY--;}else calM--;renderCal();}
function calNext(){if(calM===11){calM=0;calY++;}else calM++;renderCal();}
function renderCal(){
  document.getElementById("calmon").textContent=(new Date(calY,calM,1)).toLocaleDateString("it-IT",{"month":"long","year":"numeric"});
  var td=new Date();td.setHours(0,0,0,0);
  var first=new Date(calY,calM,1),sd=(first.getDay()+6)%7,days=(new Date(calY,calM+1,0)).getDate();
  var h='<div class="cdn">Lun</div><div class="cdn">Mar</div><div class="cdn">Mer</div><div class="cdn">Gio</div><div class="cdn">Ven</div><div class="cdn">Sab</div><div class="cdn">Dom</div>';
  for(var i=0;i<sd;i++)h+='<div></div>';
  for(var d=1;d<=days;d++){
    var dt=new Date(calY,calM,d);var diff=Math.round((dt-td)/(1000*60*60*24));
    var isPast=(diff<0&&!isAdmin);
    var cls="cday"+(dt.getTime()===td.getTime()?" tod":"")+(diff===off?" sel":"")+(isPast?" pst":"");
    h+='<div class="'+cls+'" onclick="pickDay('+diff+','+isPast+')">'+d+'</div>';
  }
  document.getElementById("cdays").innerHTML=h;
}
function pickDay(d,p){if(p)return;off=d;closeCal();render();}
function showRep(){
  var td=new Date();td.setHours(0,0,0,0);var tgt=new Date(td.getTime());tgt.setDate(td.getDate()+off);
  document.getElementById("repdate").textContent=tgt.toLocaleDateString("it-IT",{"weekday":"long","day":"numeric","month":"long","year":"numeric"});
  var h="",sids=["plateatico","interna","cucina","prive"];
  for(var si=0;si<sids.length;si++){
    var sid=sids[si];
    var fi=[],se=[],sls,j,k;
    for(j=0;j<FIRST.length;j++){sls=FIRST[j];var tbls=STABLES[sid]||[];for(k=0;k<tbls.length;k++){var e=bks[bkey(sid,off,sls,tbls[k])];if(e){var r={nome:e.nome,tel:e.tel,persone:e.persone,note:e.note,lbl:LBL[tbls[k]]||tbls[k],slot:sls};fi.push(r);}}}
    for(j=0;j<SECOND.length;j++){sls=SECOND[j];var tbls=STABLES[sid]||[];for(k=0;k<tbls.length;k++){var e=bks[bkey(sid,off,sls,tbls[k])];if(e){var r={nome:e.nome,tel:e.tel,persone:e.persone,note:e.note,lbl:LBL[tbls[k]]||tbls[k],slot:sls};se.push(r);}}}
    if(!fi.length&&!se.length)continue;
    h+='<div class="rsl"><div class="rsn">'+NOMI[sid]+'</div>';
    if(fi.length){h+='<div class="rsit">Primo Sitting - 17:30 fino 19:00</div>';for(j=0;j<fi.length;j++){var e=fi[j];h+='<div class="rrw"><div class="rnu">'+e.lbl+'</div><div class="rin"><div class="rnm">'+e.nome+'</div><div class="rdt">'+e.slot+' - '+e.tel+(e.note?' - '+e.note:'')+'</div></div><div class="rpx">'+e.persone+'px</div></div>';}}
    if(se.length){h+='<div class="rsit">Secondo Sitting - 19:30 fino 22:00</div>';for(j=0;j<se.length;j++){var e=se[j];h+='<div class="rrw"><div class="rnu">'+e.lbl+'</div><div class="rin"><div class="rnm">'+e.nome+'</div><div class="rdt">'+e.slot+' - '+e.tel+(e.note?' - '+e.note:'')+'</div></div><div class="rpx">'+e.persone+'px</div></div>';}}
    h+='</div>';
  }
  if(!h)h='<p style="text-align:center;color:rgba(240,232,220,.25);font-style:italic;padding:40px">Nessuna prenotazione</p>';
  document.getElementById("repbody").innerHTML=h;
  document.getElementById("repov").style.display="flex";
}
function hideRep(){document.getElementById("repov").style.display="none";}
loadBks();
</script>
